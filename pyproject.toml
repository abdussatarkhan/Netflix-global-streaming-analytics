[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix_global_streaming_analytics"
version = "1.0.0"
description = "End-to-end streaming intelligence warehouse & BI model: 280M+ subscriber dynamics, 400+ catalog titles ROI, 24M cohort retention, and executive D3.js dashboard (2021–2025)."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
